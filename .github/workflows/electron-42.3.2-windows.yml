name: Electron 42.3.2 - Windows x64

on:
  workflow_dispatch:
  push:
    branches:
      - electron-42.3.2

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    env:
      APP_NAME: VSCodium
      BINARY_NAME: codium
      CI_BUILD: 'no'
      GH_REPO_PATH: ${{ github.repository }}
      GITHUB_BRANCH: ${{ github.sha }}
      ORG_NAME: ${{ github.repository_owner }}
      OS_NAME: windows
      SHOULD_BUILD: 'yes'
      SHOULD_BUILD_REH: 'no'
      SHOULD_BUILD_REH_WEB: 'no'
      VSCODE_ARCH: x64
      VSCODE_QUALITY: stable
      VSCODIUM_LATEST_UPSTREAM: 'yes'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # VS Code 1.136.0 requires Node.js 24.18.0; VSCodium's checked-in
          # .nvmrc belongs to its older 1.126.0 base.
          node-version: '24.18.0'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch pinned VS Code source
        run: ./get_repo.sh

      - name: Build with Electron 42.3.2
        run: |
          # Match the SDK visibility used by VS Code's official Windows CI.
          export PATH="/c/Program Files (x86)/Windows Kits/10/bin/10.0.26100.0/x64:$PATH"
          ./build.sh

      - name: Upload portable Windows build
        uses: actions/upload-artifact@v4
        with:
          name: VSCodium-win32-x64-electron-42.3.2
          path: VSCode-win32-x64/
          if-no-files-found: error
          retention-days: 14
