name: Electron 42.3.2 - Windows x64

on:
  workflow_dispatch:
  push:
    branches:
      - electron-42.3.2

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    env:
      APP_NAME: VSCodium
      BINARY_NAME: codium
      CI_BUILD: 'no'
      GH_REPO_PATH: ${{ github.repository }}
      GITHUB_BRANCH: ${{ github.sha }}
      ORG_NAME: ${{ github.repository_owner }}
      OS_NAME: windows
      SHOULD_BUILD: 'yes'
      SHOULD_BUILD_REH: 'no'
      SHOULD_BUILD_REH_WEB: 'no'
      VSCODE_ARCH: x64
      VSCODE_QUALITY: stable
      VSCODIUM_LATEST_UPSTREAM: 'yes'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch pinned VS Code source
        run: ./get_repo.sh

      - name: Prepare VS Code sources for installer tasks
        run: |
          . ./version.sh
          . ./prepare_vscode.sh

      - name: Reuse known-good portable build from run 15
        uses: actions/download-artifact@v4
        with:
          name: VSCodium-win32-x64-electron-42.3.2
          path: VSCode-win32-x64
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 33760861645

      - name: Verify reused portable build
        run: |
          test -d VSCode-win32-x64/resources/app
          test -f VSCode-win32-x64/resources/app/product.json
          echo "Portable build restored successfully"
          ls -la VSCode-win32-x64 | head -100

      - name: Build Windows installers
        run: |
          . ./version.sh
          export RELEASE_VERSION
          export SHOULD_BUILD_CLI=no
          export SHOULD_BUILD_EXE_SYS=yes
          export SHOULD_BUILD_EXE_USR=yes
          export SHOULD_BUILD_ZIP=yes
          export SHOULD_BUILD_MSI=no
          export SHOULD_BUILD_MSI_NOUP=no
          ./prepare_assets.sh

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: VSCodium-win32-x64-electron-42.3.2-packages
          path: |
            assets/*.exe
            assets/*.zip
          if-no-files-found: error
          retention-days: 14
