name: Electron 42.3.2 - Windows x64

on:
  workflow_dispatch:
  push:
    branches:
      - electron-42.3.2
    paths:
      - '.github/workflows/electron-42.3.2-windows.yml'
      - '.github/workflows/electron-42.3.2-linux-reh.yml'
      - '.github/workflows/electron-42.3.2-release.yml'
      - 'build.sh'
      - 'prepare_vscode.sh'
      - 'build/linux/package_reh.sh'
      - 'build/windows/preserve-marketplace-selection.ps1'
      - 'build/electron/**'
      - 'patches/**'
      - 'product.json'
      - 'upstream/stable.json'
      - 'npmrc'

permissions:
  contents: read

jobs:
  build-and-package:
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    env:
      APP_NAME: VSCodium
      BINARY_NAME: codium
      CI_BUILD: 'no'
      GH_REPO_PATH: ${{ github.repository }}
      GITHUB_BRANCH: ${{ github.sha }}
      ORG_NAME: ${{ github.repository_owner }}
      OS_NAME: windows
      SHOULD_BUILD: 'yes'
      SHOULD_BUILD_REH: 'no'
      SHOULD_BUILD_REH_WEB: 'no'
      VSCODE_ARCH: x64
      VSCODE_QUALITY: stable
      VSCODIUM_LATEST_UPSTREAM: 'yes'
      VSCODIUM_CONTEXT_MENU_PUBLISHER: 'CN=VSCodium'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # VS Code 1.136.0 requires Node.js 24.18.0; VSCodium's checked-in
          # .nvmrc belongs to its older release line.
          node-version: '24.18.0'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch pinned VS Code source
        run: ./get_repo.sh

      - name: Verify selected upstream
        run: |
          test -n "$MS_TAG"
          test -n "$MS_COMMIT"
          test "$(jq -r '.tag' upstream/stable.json)" = "$MS_TAG"
          test "$(jq -r '.commit' upstream/stable.json)" = "$MS_COMMIT"
          echo "Selected VS Code: $MS_TAG ($MS_COMMIT)"

      - name: Preserve an existing local Marketplace override on upgrade
        run: |
          git -C vscode apply --ignore-whitespace --check ../patches/02-preserve-marketplace-selection-in-installer.patch
          git -C vscode apply --ignore-whitespace ../patches/02-preserve-marketplace-selection-in-installer.patch

      - name: Build portable VSCodium with Electron 42.3.2
        run: |
          # Match the SDK visibility used by VS Code's Windows CI.
          export PATH="/c/Program Files (x86)/Windows Kits/10/bin/10.0.26100.0/x64:$PATH"
          ./build.sh

      # build.sh recreates vscode/build, so this installer-only helper must be
      # staged after the portable build rather than before it.
      - name: Stage installer Marketplace helper
        run: |
          cp build/windows/preserve-marketplace-selection.ps1 vscode/build/win32/vscodium-preserve-marketplace-selection.ps1
          test -f vscode/build/win32/vscodium-preserve-marketplace-selection.ps1

      - name: Verify portable build and signature policy
        run: |
          test -d VSCode-win32-${VSCODE_ARCH}/resources/app
          test -f VSCode-win32-${VSCODE_ARCH}/resources/app/product.json
          test -d VSCode-win32-${VSCODE_ARCH}/appx/manifest
          grep -F 'target="42.3.2"' vscode/.npmrc
          grep -F 'verifySignature = false;' vscode/src/vs/platform/extensionManagement/node/extensionManagementService.ts
          if grep -Fq 'VerifyExtensionSignatureConfigKey' vscode/src/vs/platform/extensionManagement/node/extensionManagementService.ts; then
            echo "Unexpected signature-verification configuration hook remains" >&2
            exit 1
          fi
          echo "Portable build and VSCodium no-signature-verification policy verified"

      - name: Upload portable Windows build
        uses: actions/upload-artifact@v4
        with:
          name: VSCodium-win32-x64-electron-42.3.2
          path: VSCode-win32-x64/
          if-no-files-found: error
          retention-days: 14

      - name: Prepare installer metadata
        run: |
          . ./version.sh
          echo "RELEASE_VERSION=${RELEASE_VERSION}" >> "$GITHUB_ENV"
          mkdir -p assets
          echo "Packaging release ${RELEASE_VERSION}"

      - name: Download Explorer context menu DLL
        run: |
          cd vscode
          node build/win32/explorer-dll-fetcher.ts ../VSCode-win32-${VSCODE_ARCH}/appx
          cd ..
          test -f "VSCode-win32-${VSCODE_ARCH}/appx/code_explorer_command_${VSCODE_ARCH}.dll"

      - name: Pack Windows context menu APPX
        shell: pwsh
        run: |
          $sdk = "C:\Program Files (x86)\Windows Kits\10\bin\10.0.26100.0\x64"
          $env:PATH = "$sdk;$env:PATH"

          $appxDir = Join-Path $env:GITHUB_WORKSPACE "VSCode-win32-$env:VSCODE_ARCH\appx"
          $manifestPath = Join-Path $appxDir "manifest\AppxManifest.xml"

          if (-not (Test-Path $manifestPath)) {
            throw "APPX manifest is missing: $manifestPath"
          }

          [xml]$manifest = Get-Content -Raw $manifestPath
          $originalVersion = [string]$manifest.Package.Identity.Version
          $versionParts = $originalVersion.Split('.')
          if ($versionParts.Count -ne 4) {
            throw "Unexpected APPX manifest version: $originalVersion"
          }

          $normalizedParts = foreach ($part in $versionParts) {
            $value = 0
            if (-not [int]::TryParse($part, [ref]$value)) {
              throw "Invalid APPX manifest version component '$part' in '$originalVersion'"
            }
            if ($value -lt 0 -or $value -gt 65535) {
              throw "APPX manifest version component '$part' is outside 0..65535"
            }
            $value.ToString()
          }

          $normalizedVersion = $normalizedParts -join '.'
          $manifest.Package.Identity.Version = $normalizedVersion
          $manifest.Package.Identity.Publisher = $env:VSCODIUM_CONTEXT_MENU_PUBLISHER

          $settings = New-Object System.Xml.XmlWriterSettings
          $settings.Indent = $true
          $settings.Encoding = New-Object System.Text.UTF8Encoding($false)
          $writer = [System.Xml.XmlWriter]::Create($manifestPath, $settings)
          try {
            $manifest.Save($writer)
          } finally {
            $writer.Dispose()
          }

          Write-Host "Normalized APPX version: $originalVersion -> $normalizedVersion"

          $certificate = New-SelfSignedCertificate `
            -Type Custom `
            -Subject $env:VSCODIUM_CONTEXT_MENU_PUBLISHER `
            -KeyUsage DigitalSignature `
            -KeyExportPolicy Exportable `
            -CertStoreLocation 'Cert:\CurrentUser\My' `
            -FriendlyName 'VSCodium Explorer Context Menu' `
            -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3')

          $certificatePath = Join-Path $appxDir 'vscodium-context-menu.cer'
          Export-Certificate -Cert $certificate -FilePath $certificatePath | Out-Null
          Import-Certificate -FilePath $certificatePath -CertStoreLocation 'Cert:\CurrentUser\TrustedPeople' | Out-Null
          # `signtool verify /pa` evaluates the trusted-root chain rather than
          # the per-user TrustedPeople store used by the shipped installer.
          # This is a disposable GitHub runner, so trust the ephemeral build
          # certificate locally only for the verification step below.
          Import-Certificate -FilePath $certificatePath -CertStoreLocation 'Cert:\LocalMachine\Root' | Out-Null

          $appxPath = Join-Path $appxDir "code_$env:VSCODE_ARCH.appx"
          makeappx pack `
            /d "$appxDir\manifest" `
            /p $appxPath `
            /nv

          & signtool sign /fd SHA256 /sha1 $certificate.Thumbprint /s My $appxPath
          if ($LASTEXITCODE -ne 0) {
            throw "signtool failed to sign $appxPath"
          }

          & signtool verify /pa /all $appxPath
          if ($LASTEXITCODE -ne 0) {
            throw "signtool failed to verify $appxPath"
          }

          # The AppX manifest activates this DLL from ExternalLocation. Explorer
          # rejects an unsigned COM server even when the AppX itself is signed.
          $explorerDllPath = Join-Path $appxDir "code_explorer_command_$env:VSCODE_ARCH.dll"
          & signtool sign /fd SHA256 /sha1 $certificate.Thumbprint /s My $explorerDllPath
          if ($LASTEXITCODE -ne 0) {
            throw "signtool failed to sign $explorerDllPath"
          }

          & signtool verify /pa /all $explorerDllPath
          if ($LASTEXITCODE -ne 0) {
            throw "signtool failed to verify $explorerDllPath"
          }

          Remove-Item "$appxDir\manifest" -Recurse -Force

          if (-not (Test-Path "$appxDir\code_$env:VSCODE_ARCH.appx")) {
            throw "APPX package was not created"
          }
          if (-not (Test-Path $certificatePath)) {
            throw "VSCodium context-menu certificate was not created"
          }

          Get-ChildItem $appxDir

      - name: Prepare Inno updater
        run: |
          cd vscode
          npm run gulp "vscode-win32-${VSCODE_ARCH}-inno-updater"

      - name: Build portable ZIP
        run: |
          7z.exe a -tzip "assets/${APP_NAME}-win32-${VSCODE_ARCH}-${RELEASE_VERSION}.zip" -x!CodeSignSummary*.md -x!tools "VSCode-win32-${VSCODE_ARCH}/*" -r

      - name: Build System EXE
        run: |
          test -f vscode/build/win32/vscodium-preserve-marketplace-selection.ps1
          cd vscode
          npm run gulp "vscode-win32-${VSCODE_ARCH}-system-setup"
          cd ..
          mv "vscode/.build/win32-${VSCODE_ARCH}/system-setup/VSCodeSetup.exe" "assets/${APP_NAME}Setup-${VSCODE_ARCH}-${RELEASE_VERSION}.exe"

      - name: Build User EXE
        run: |
          cd vscode
          npm run gulp "vscode-win32-${VSCODE_ARCH}-user-setup"
          cd ..
          mv "vscode/.build/win32-${VSCODE_ARCH}/user-setup/VSCodeSetup.exe" "assets/${APP_NAME}UserSetup-${VSCODE_ARCH}-${RELEASE_VERSION}.exe"

      - name: Inspect installer outputs
        run: |
          ls -lah assets
          test -s "assets/${APP_NAME}-win32-${VSCODE_ARCH}-${RELEASE_VERSION}.zip"
          test -s "assets/${APP_NAME}Setup-${VSCODE_ARCH}-${RELEASE_VERSION}.exe"
          test -s "assets/${APP_NAME}UserSetup-${VSCODE_ARCH}-${RELEASE_VERSION}.exe"

      - name: Upload Windows installer packages
        uses: actions/upload-artifact@v4
        with:
          name: VSCodium-win32-x64-electron-42.3.2-packages
          path: |
            assets/*.exe
            assets/*.zip
          if-no-files-found: error
          retention-days: 14
