name: Check VS Code Stable for Electron 42 build

on:
  schedule:
    # Check four times per day, away from the busiest top-of-hour schedule slot.
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: vscode-stable-electron-42-update
  cancel-in-progress: false

jobs:
  update-and-dispatch:
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: electron-42.3.2
      UPDATE_ENDPOINT: https://update.code.visualstudio.com/api/update/darwin/stable/0000000000000000000000000000000000000000

    steps:
      - name: Check out the Electron 42 build branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          persist-credentials: true

      - name: Compare the upstream Stable release
        id: upstream
        shell: bash
        run: |
          set -euo pipefail

          response="$(curl --fail --location --retry 3 --retry-all-errors --silent --show-error "$UPDATE_ENDPOINT")"
          tag="$(jq --raw-output '.name // empty' <<<"$response")"
          commit="$(jq --raw-output '.version // empty' <<<"$response")"

          [[ "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Unexpected VS Code Stable tag: $tag" >&2
            exit 1
          }
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Unexpected VS Code Stable commit: $commit" >&2
            exit 1
          }

          current_tag="$(jq --raw-output '.tag' upstream/stable.json)"
          current_commit="$(jq --raw-output '.commit' upstream/stable.json)"
          if [[ "$tag" == "$current_tag" && "$commit" == "$current_commit" ]]; then
            echo "No new VS Code Stable release: $tag ($commit)"
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          jq --arg tag "$tag" --arg commit "$commit" \
            '.tag = $tag | .commit = $commit' \
            upstream/stable.json > upstream/stable.json.next
          mv upstream/stable.json.next upstream/stable.json

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "VS Code Stable advanced: $current_tag ($current_commit) -> $tag ($commit)"

      - name: Commit the selected upstream release
        if: steps.upstream.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config commit.gpgsign false
          git add upstream/stable.json
          git commit -m "build(stable): update to VS Code ${{ steps.upstream.outputs.tag }}"
          git push origin "HEAD:${TARGET_BRANCH}"

      # A GITHUB_TOKEN push deliberately does not emit a push-triggered run.
      # Dispatch the three registered build/release workflows explicitly instead.
      - name: Start the matching build and release workflows
        if: steps.upstream.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run 'Electron 42.3.2 - Windows x64' --repo "$GITHUB_REPOSITORY" --ref "$TARGET_BRANCH"
          gh workflow run 'Electron 42.3.2 - Linux x64 REH' --repo "$GITHUB_REPOSITORY" --ref "$TARGET_BRANCH"
          gh workflow run 'Electron 42.3.2 - Publish Windows and Linux REH' --repo "$GITHUB_REPOSITORY" --ref "$TARGET_BRANCH"
