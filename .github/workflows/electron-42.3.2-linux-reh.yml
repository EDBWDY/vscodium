name: Electron 42.3.2 - Linux x64 REH

on:
  workflow_dispatch:
  push:
    branches:
      - electron-42.3.2
    paths:
      - '.github/workflows/electron-42.3.2-windows.yml'
      - '.github/workflows/electron-42.3.2-linux-reh.yml'
      - '.github/workflows/electron-42.3.2-release.yml'
      - 'build.sh'
      - 'prepare_vscode.sh'
      - 'build/linux/package_reh.sh'
      - 'build/electron/**'
      - 'patches/**'
      - 'product.json'
      - 'upstream/stable.json'
      - 'npmrc'

permissions:
  contents: read

concurrency:
  group: electron-42.3.2-linux-reh-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_NAME: VSCodium
  BINARY_NAME: codium
  CI_BUILD: 'yes'
  GH_REPO_PATH: ${{ github.repository }}
  GITHUB_BRANCH: ${{ github.sha }}
  ORG_NAME: ${{ github.repository_owner }}
  OS_NAME: linux
  VSCODE_QUALITY: stable
  VSCODIUM_LATEST_UPSTREAM: 'yes'

jobs:
  compile:
    runs-on: ubuntu-22.04
    env:
      VSCODE_ARCH: x64
      SHOULD_BUILD: 'yes'
      SHOULD_BUILD_REH: 'no'
      SHOULD_BUILD_REH_WEB: 'no'
    outputs:
      BUILD_SOURCEVERSION: ${{ env.BUILD_SOURCEVERSION }}
      MS_COMMIT: ${{ env.MS_COMMIT }}
      MS_TAG: ${{ env.MS_TAG }}
      RELEASE_VERSION: ${{ env.RELEASE_VERSION }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup GCC 10
        uses: egor-tensin/setup-gcc@a2861a8b8538f49cf2850980acccf6b05a1b2ae4
        with:
          version: 10
          platform: x64

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install native build dependencies
        run: sudo apt-get update -y && sudo apt-get install -y libkrb5-dev

      - name: Fetch pinned VS Code source
        run: ./get_repo.sh

      - name: Verify pinned upstream
        run: |
          test "$MS_TAG" = "1.136.0"
          test "$MS_COMMIT" = "520fb30b2d3d324b4cb2342f6e88e2cd93751de1"
          echo "Pinned VS Code: $MS_TAG ($MS_COMMIT)"

      - name: Install compile diagnostics
        run: |
          cat > "$RUNNER_TEMP/run-diagnostic-stage.sh" <<'EOF'
          #!/usr/bin/env bash
          set -Eeuo pipefail

          label="$1"
          shift

          snapshot() {
            echo "::group::Diagnostics - ${label} - $1"
            date -u '+UTC %Y-%m-%dT%H:%M:%SZ'
            uptime || true
            free -h || true
            df -h . /tmp || true
            echo "::endgroup::"
          }

          processes() {
            echo "::group::Process tree - ${label}"
            (ps -eo pid,ppid,stat,etime,%cpu,%mem,rss,comm,args --sort=-rss | head -n 50) || true
            echo "::endgroup::"
          }

          on_term() {
            echo "::error::SIGTERM received during ${label}"
            snapshot "SIGTERM"
            processes
            exit 143
          }

          on_int() {
            echo "::error::SIGINT received during ${label}"
            snapshot "SIGINT"
            processes
            exit 130
          }

          trap on_term TERM
          trap on_int INT

          snapshot "start"
          started="$(date +%s)"

          set +e
          "$@"
          rc=$?
          set -e

          ended="$(date +%s)"
          snapshot "end rc=${rc}, elapsed=$((ended - started))s"
          if (( rc != 0 )); then
            processes
          fi

          exit "$rc"
          EOF
          chmod +x "$RUNNER_TEMP/run-diagnostic-stage.sh"

          cat > "$RUNNER_TEMP/core-ci-stage.mjs" <<'EOF'
          import path from 'node:path';
          import { pathToFileURL } from 'node:url';

          const stage = process.argv[2];
          const root = process.cwd();
          const load = relativePath => import(pathToFileURL(path.join(root, relativePath)).href);

          if (stage === 'date') {
            const { writeISODate } = await load('build/lib/date.ts');
            await writeISODate('out-build')();
          } else if (stage === 'typecheck') {
            const { spawnTsgo } = await load('build/lib/tsgo.ts');
            await spawnTsgo(path.join(root, 'src', 'tsconfig.json'), {
              taskName: 'tsgo-typecheck',
              noEmit: true
            });
          } else if (stage === 'transpile') {
            const { runEsbuildTranspile } = await load('build/lib/esbuild.ts');
            await runEsbuildTranspile('out-build', false);
          } else if (stage === 'bundles') {
            const { getVersion } = await load('build/lib/getVersion.ts');
            const { runEsbuildBundle } = await load('build/lib/esbuild.ts');
            const sourceMappingURLBase = `https://main.vscode-cdn.net/sourcemaps/${getVersion(root)}`;

            const runBundle = async (name, fn) => {
              const started = Date.now();
              console.log(`[diagnostic] Starting ${name} at ${new Date().toISOString()}`);
              try {
                await fn();
                console.log(`[diagnostic] Finished ${name} after ${Date.now() - started} ms`);
              } catch (error) {
                console.error(`[diagnostic] Failed ${name} after ${Date.now() - started} ms`);
                throw error;
              }
            };

            await Promise.all([
              runBundle('esbuild-vscode-reh-min', () =>
                runEsbuildBundle('out-vscode-reh-min', true, true, 'server', `${sourceMappingURLBase}/core`)),
              runBundle('esbuild-vscode-reh-web-min', () =>
                runEsbuildBundle('out-vscode-reh-web-min', true, true, 'server-web', `${sourceMappingURLBase}/core`))
            ]);
          } else {
            throw new Error(`Unknown core-ci diagnostic stage: ${stage}`);
          }
          EOF

      - name: Prepare current-upstream source
        run: |
          "$RUNNER_TEMP/run-diagnostic-stage.sh" "prepare-vscode" bash -c '
            set -ex
            . ./version.sh
            echo "MS_COMMIT=\"${MS_COMMIT}\""
            . ./prepare_vscode.sh

            {
              echo "ELECTRON_SKIP_BINARY_DOWNLOAD=${ELECTRON_SKIP_BINARY_DOWNLOAD}"
              echo "PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=${PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD}"
              echo "VSCODE_SKIP_NODE_VERSION_CHECK=${VSCODE_SKIP_NODE_VERSION_CHECK}"
            } >> "${GITHUB_ENV}"

            if [[ "${VSCODIUM_LATEST_UPSTREAM}" == "yes" ]]; then
              ./build/electron/apply-vscodium-signature-policy.sh
            fi
          '

      - name: Core CI - Copy codicons
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          VSCODE_PUBLISH_COUNTER: '1'
        run: |
          cd vscode
          "$RUNNER_TEMP/run-diagnostic-stage.sh" "copy-codicons" npm run gulp copy-codicons

      - name: Core CI - Compile non-native extensions
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          VSCODE_PUBLISH_COUNTER: '1'
        run: |
          cd vscode
          "$RUNNER_TEMP/run-diagnostic-stage.sh" "compile-non-native-extensions-build" npm run gulp compile-non-native-extensions-build

      - name: Core CI - Compile Copilot extension
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          VSCODE_PUBLISH_COUNTER: '1'
        run: |
          cd vscode
          "$RUNNER_TEMP/run-diagnostic-stage.sh" "compile-copilot-extension-build" npm run gulp compile-copilot-extension-build

      - name: Core CI - Compile extension media
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          VSCODE_PUBLISH_COUNTER: '1'
        run: |
          cd vscode
          "$RUNNER_TEMP/run-diagnostic-stage.sh" "compile-extension-media-build" npm run gulp compile-extension-media-build

      - name: Core CI - Write build date
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          VSCODE_PUBLISH_COUNTER: '1'
        run: |
          cd vscode
          "$RUNNER_TEMP/run-diagnostic-stage.sh" "build-date-file" node --experimental-strip-types "$RUNNER_TEMP/core-ci-stage.mjs" date

      - name: Core CI - Typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          VSCODE_PUBLISH_COUNTER: '1'
        run: |
          cd vscode
          "$RUNNER_TEMP/run-diagnostic-stage.sh" "tsgo-typecheck" node --experimental-strip-types "$RUNNER_TEMP/core-ci-stage.mjs" typecheck

      - name: Core CI - Transpile out-build
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          VSCODE_PUBLISH_COUNTER: '1'
        run: |
          cd vscode
          "$RUNNER_TEMP/run-diagnostic-stage.sh" "esbuild-out-build" node --experimental-strip-types "$RUNNER_TEMP/core-ci-stage.mjs" transpile

      - name: Core CI - Build REH bundles
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          VSCODE_PUBLISH_COUNTER: '1'
        run: |
          cd vscode
          "$RUNNER_TEMP/run-diagnostic-stage.sh" "esbuild-bundles" node --experimental-strip-types "$RUNNER_TEMP/core-ci-stage.mjs" bundles

      - name: Finalize Linux compile tree
        run: rm -f vscode/.build/extensions/ms-vscode.js-debug/src/win32-app-container-tokens.*.node

      - name: Verify VSCodium signature policy
        run: |
          grep -F 'verifySignature = false;' vscode/src/vs/platform/extensionManagement/node/extensionManagementService.ts
          if grep -Fq 'VerifyExtensionSignatureConfigKey' vscode/src/vs/platform/extensionManagement/node/extensionManagementService.ts; then
            echo "Unexpected signature-verification configuration hook remains" >&2
            exit 1
          fi

      - name: Archive compiled VS Code tree
        run: |
          find vscode -type f -not -path '*/node_modules/*' -not -path 'vscode/.build/node/*' -not -path 'vscode/.git/*' > vscode.txt
          test -d vscode/.build/extensions/copilot/node_modules/@github/copilot/sdk
          echo 'vscode/.build/extensions/node_modules' >> vscode.txt
          echo 'vscode/.build/extensions/copilot/node_modules' >> vscode.txt
          echo 'vscode/.git' >> vscode.txt
          # Copilot's production dependencies can be linked from npm's
          # hoisted tree. Dereference the explicitly listed runtime directory
          # so the next job receives the SDK files rather than a dead link.
          tar -czhf vscode.tar.gz -T vscode.txt
          test -s vscode.tar.gz
          tar -tzf vscode.tar.gz | grep -F 'vscode/.build/extensions/copilot/node_modules/@github/copilot/sdk/' >/dev/null

      - name: Upload compiled source
        uses: actions/upload-artifact@v4
        with:
          name: vscode-electron-42.3.2-linux-reh-source
          path: vscode.tar.gz
          if-no-files-found: error
          retention-days: 1

  reh-linux-x64:
    needs: compile
    runs-on: ubuntu-22.04
    env:
      BUILD_SOURCEVERSION: ${{ needs.compile.outputs.BUILD_SOURCEVERSION }}
      MS_COMMIT: ${{ needs.compile.outputs.MS_COMMIT }}
      MS_TAG: ${{ needs.compile.outputs.MS_TAG }}
      RELEASE_VERSION: ${{ needs.compile.outputs.RELEASE_VERSION }}
      SHOULD_BUILD_REH: 'yes'
      SHOULD_BUILD_REH_WEB: 'no'
      SKIP_REH_MINIFY: 'yes'
      VSCODE_ARCH: x64
      npm_config_arch: x64

    steps:
      - uses: actions/checkout@v4

      - name: Setup GCC 10
        uses: egor-tensin/setup-gcc@a2861a8b8538f49cf2850980acccf6b05a1b2ae4
        with:
          version: 10
          platform: x64

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install native build dependencies
        run: sudo apt-get update -y && sudo apt-get install -y libkrb5-dev

      - name: Install GitHub CLI helper
        run: ./build/linux/install_gh.sh

      - name: Download compiled source
        uses: actions/download-artifact@v4
        with:
          name: vscode-electron-42.3.2-linux-reh-source

      - name: Build Linux x64 Remote Extension Host
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./build/linux/package_reh.sh

      - name: Verify REH artifact
        run: |
          shopt -s nullglob
          reh=(assets/vscodium-reh-linux-x64-*.tar.gz)
          if [[ ${#reh[@]} -ne 1 ]]; then
            echo "Expected exactly one Linux x64 REH archive, found ${#reh[@]}" >&2
            ls -lah assets || true
            exit 1
          fi
          test -s "${reh[0]}"
          test -s "${reh[0]}.sha256"
          test -s "${reh[0]}.sha1"
          tar -tzf "${reh[0]}" >/dev/null
          tar -tzf "${reh[0]}" | grep -F './extensions/copilot/node_modules/@github/copilot/sdk/' >/dev/null
          echo "Verified ${reh[0]}"

      - name: Upload Linux x64 REH
        uses: actions/upload-artifact@v4
        with:
          name: VSCodium-reh-linux-x64-vscode-1.136-electron-42.3.2
          path: |
            assets/vscodium-reh-linux-x64-*.tar.gz
            assets/vscodium-reh-linux-x64-*.tar.gz.sha256
            assets/vscodium-reh-linux-x64-*.tar.gz.sha1
          if-no-files-found: error
          retention-days: 14
